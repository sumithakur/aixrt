stages:
  - test
  - build
  - docker

variables:
  NODE_IMAGE: node:22-alpine
  NEXT_TELEMETRY_DISABLED: "1"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

.node:
  image: $NODE_IMAGE
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --prefer-offline --no-audit

validate-content:
  extends: .node
  stage: test
  script:
    - npm run validate:content

typecheck:
  extends: .node
  stage: test
  script:
    - npx tsc --noEmit

build:
  extends: .node
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - .next/
    expire_in: 1 day

docker-build:
  image: docker:latest
  stage: docker
  services:
    - docker:dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - echo "Building Docker image..."
    # Tag is <branch>-1.<pipeline number, 2 digits>, e.g. develop-1.05, staging-1.06
    - export ROUNDED_PIPELINE_IID=$(printf "%02d" $((CI_PIPELINE_IID % 100)))
    - export TAG_NAME="$CI_COMMIT_REF_SLUG-1.$ROUNDED_PIPELINE_IID"
    - export CI_REGISTRY_IMAGE_WITH_TAG="$CI_REGISTRY_IMAGE:$TAG_NAME"
    - docker build --pull -t "$CI_REGISTRY_IMAGE_WITH_TAG" .
    - echo "Pushing Docker image to registry..."
    - docker push "$CI_REGISTRY_IMAGE_WITH_TAG"
    - echo "Docker image pushed successfully - $CI_REGISTRY_IMAGE_WITH_TAG"
  only:
    - production
