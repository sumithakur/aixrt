stages:
  - test
  - build
  - docker

variables:
  NODE_IMAGE: node:22-alpine
  NEXT_TELEMETRY_DISABLED: "1"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

.node:
  image: $NODE_IMAGE
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --prefer-offline --no-audit

validate-content:
  extends: .node
  stage: test
  script:
    - npm run validate:content

typecheck:
  extends: .node
  stage: test
  script:
    - npx tsc --noEmit

build:
  extends: .node
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - .next/
    expire_in: 1 day

docker-image:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  # Serialize runs so two pipelines never compute the same version number.
  resource_group: docker-release
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE_SHA: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    VERSION_MAJOR_START: "1"
  before_script:
    - apk add --no-cache curl jq
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker pull "$CI_REGISTRY_IMAGE:latest" || true
    - docker build --cache-from "$CI_REGISTRY_IMAGE:latest" -t "$IMAGE_SHA" .
    - docker push "$IMAGE_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        # Find the highest existing MAJOR.MINOR tag in the registry and bump it:
        # 1.0 -> 1.1 -> ... -> 1.99 -> 2.0 -> ...
        REPO_PATH="${CI_REGISTRY_IMAGE#$CI_REGISTRY/}"
        TOKEN=$(curl -fsS -u "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" \
          "$CI_SERVER_URL/jwt/auth?service=container_registry&scope=repository:$REPO_PATH:pull" | jq -r '.token')
        LAST=$(curl -fsS -H "Authorization: Bearer $TOKEN" \
          "https://$CI_REGISTRY/v2/$REPO_PATH/tags/list?n=10000" \
          | jq -r '.tags[]?' | grep -E '^[0-9]+\.[0-9]+$' | sort -t. -k1,1n -k2,2n | tail -n1 || true)
        if [ -z "$LAST" ]; then
          VERSION="$VERSION_MAJOR_START.0"
        else
          MAJOR="${LAST%%.*}"
          MINOR="${LAST#*.}"
          MINOR=$((MINOR + 1))
          if [ "$MINOR" -gt 99 ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
          fi
          VERSION="$MAJOR.$MINOR"
        fi
        echo "Previous version: ${LAST:-none} -> New version: $VERSION"
        docker tag "$IMAGE_SHA" "$CI_REGISTRY_IMAGE:$VERSION"
        docker push "$CI_REGISTRY_IMAGE:$VERSION"
        docker tag "$IMAGE_SHA" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$IMAGE_SHA" "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
